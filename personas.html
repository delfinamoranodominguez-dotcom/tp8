
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear personas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="banner">
        <button onclick="location.href='personas.html'">Crear personas</button>
        <button onclick="location.href='autos.html'">Crear autos</button>
        <button onclick="location.href='mostrar.html'">Mostrar datos</button>
    </div>


    <h1>Crear personas</h1>

    <label>Nombre:</label>
    <input type="text" id="nombre">
    <br><br>

    <label>Edad:</label>
    <input type="number" id="edad">
    <br><br>

    <label>Tipo de carnet:</label>
    <select id="tipo_carnet">
        <option value="A1">A1</option>
        <option value="A2">A2</option>
        <option value="A3">A3</option>
    </select>
    <br><br>

    <label>¿Tiene seguro?</label>
    <select id="seguro">
        <option value="si">Sí</option>
        <option value="no">No</option>
    </select>
    <br><br>


    <p id="resultado"></p>

    <script src="personas.js"></script>

</body>
</html>
